<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motioncade Controller</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* ===== JOIN PAGE ===== */
        #joinPage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 30px;
        }

        #joinPage h1 {
            font-size: 2.2em;
            color: #ff3860;
            margin-bottom: 8px;
        }

        #joinPage .sub {
            color: #666;
            margin-bottom: 40px;
            font-size: 0.95em;
        }

        #joinPage label {
            color: #999;
            font-size: 1em;
            margin-bottom: 10px;
        }

        #codeInput {
            width: 260px;
            padding: 14px;
            font-size: 1.6em;
            text-align: center;
            background: #12122a;
            border: 2px solid #222255;
            border-radius: 12px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            outline: none;
        }

        #codeInput:focus {
            border-color: #ff3860;
        }

        #joinBtn {
            width: 260px;
            padding: 14px;
            font-size: 1.3em;
            background: #ff3860;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #joinBtn:active {
            background: #d42f52;
            transform: scale(0.97);
        }

        #joinStatus {
            margin-top: 18px;
            font-size: 0.95em;
            color: #666;
            text-align: center;
            min-height: 1.5em;
        }

        #joinStatus.ok { color: #00ff88; }
        #joinStatus.bad { color: #ff4444; }

        /* ===== SENSOR PAGE ===== */
        #sensorPage {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 30px;
        }

        #sensorPage h2 {
            font-size: 1.6em;
            margin-bottom: 15px;
        }

        #sensorPage p {
            color: #888;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 35px;
            max-width: 300px;
        }

        #sensorBtn {
            padding: 18px 50px;
            font-size: 1.4em;
            background: #ff3860;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #sensorBtn:active {
            background: #d42f52;
        }

        /* ===== CONTROLLER PAGE ===== */
        #controlPage {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        .topBar {
            padding: 14px 20px;
            background: #12122a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topBar .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .topBar .connText {
            color: #00ff88;
            font-size: 0.9em;
        }

        .topBar .brand {
            color: #ff3860;
            font-weight: bold;
            font-size: 1.1em;
        }

        .sensorBar {
            padding: 8px 15px;
            background: #0d0d22;
            display: flex;
            justify-content: center;
            gap: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.7em;
            color: #444;
        }

        .btnArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }

        #fireButton {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 4px solid #ff3860;
            background: rgba(255, 56, 96, 0.15);
            color: white;
            font-size: 1.4em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #fireButton:active {
            background: #ff3860;
            transform: scale(0.92);
            box-shadow: 0 0 50px rgba(255, 56, 96, 0.5);
        }

        #calButton {
            padding: 10px 28px;
            background: transparent;
            border: 2px solid #222255;
            color: #666;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
        }

        #calButton:active {
            border-color: #00ff88;
            color: #00ff88;
        }

        .flash {
            animation: flashAnim 0.12s;
        }

        @keyframes flashAnim {
            0% { background: rgba(255, 56, 96, 0.5); }
            100% { background: rgba(255, 56, 96, 0.15); }
        }
    </style>
</head>
<body>

<!-- JOIN PAGE -->
<div id="joinPage">
    <h1>🎮 MOTIONCADE</h1>
    <p class="sub">Controller</p>
    <label>Enter Game Code</label>
    <input type="text" id="codeInput" maxlength="9" placeholder="MC-XXXX" autocomplete="off" autocapitalize="characters">
    <button id="joinBtn">CONNECT</button>
    <div id="joinStatus"></div>
</div>

<!-- SENSOR PERMISSION PAGE -->
<div id="sensorPage">
    <h2>📱 Enable Sensors</h2>
    <p>
        Your phone's gyroscope and accelerometer are needed to control the game.
        <br><br>
        Tap the button to allow access.
    </p>
    <button id="sensorBtn">ENABLE SENSORS</button>
</div>

<!-- CONTROLLER PAGE -->
<div id="controlPage">
    <div class="topBar">
        <div>
            <span class="dot"></span>
            <span class="connText">Connected</span>
        </div>
        <span class="brand">MOTIONCADE</span>
    </div>
    <div class="sensorBar">
        <span id="dPitch">pitch: 0</span>
        <span id="dRoll">roll: 0</span>
        <span id="dYaw">yaw: 0</span>
    </div>
    <div class="btnArea">
        <button id="fireButton">🔥 FIRE</button>
        <button id="calButton">🔄 Recalibrate</button>
    </div>
</div>

<script>
/* =============================================
   VARIABLES
============================================= */
let peer = null;
let conn = null;
let sensorsOn = false;
let sendLoop = null;

let data = {
    alpha: 0, beta: 0, gamma: 0,
    ax: 0, ay: 0, az: 0,
    fire: false, recalibrate: false
};

/* =============================================
   JOIN
============================================= */
const joinBtn = document.getElementById('joinBtn');
const codeInput = document.getElementById('codeInput');
const joinStatus = document.getElementById('joinStatus');

joinBtn.addEventListener('click', connect);
codeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') connect();
});

function connect() {
    let code = codeInput.value.trim().toUpperCase();
    if (!code) {
        joinStatus.textContent = 'Enter a code first';
        joinStatus.className = 'bad';
        return;
    }

    joinStatus.textContent = 'Connecting...';
    joinStatus.className = '';

    let myId = 'ctrl-' + Math.random().toString(36).substring(2, 8);
    peer = new Peer(myId);

    peer.on('open', () => {
        conn = peer.connect(code, { reliable: true });

        conn.on('open', () => {
            joinStatus.textContent = 'Connected!';
            joinStatus.className = 'ok';

            // Check if we need iOS sensor permission
            if (typeof DeviceOrientationEvent !== 'undefined' &&
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.getElementById('joinPage').style.display = 'none';
                document.getElementById('sensorPage').style.display = 'flex';
            } else {
                startSensors();
                showController();
            }
        });

        conn.on('error', (err) => {
            joinStatus.textContent = 'Failed: ' + err;
            joinStatus.className = 'bad';
        });

        conn.on('close', () => {
            joinStatus.textContent = 'Disconnected';
            joinStatus.className = 'bad';
        });
    });

    peer.on('error', (err) => {
        joinStatus.textContent = 'Error: ' + err.type;
        joinStatus.className = 'bad';
    });
}

/* =============================================
   SENSOR PERMISSION
============================================= */
document.getElementById('sensorBtn').addEventListener('click', async () => {
    try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            let p = await DeviceOrientationEvent.requestPermission();
            if (p !== 'granted') {
                alert('Permission denied. Controller needs motion sensors.');
                return;
            }
        }
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
            await DeviceMotionEvent.requestPermission();
        }
    } catch (e) {
        console.error(e);
    }

    startSensors();
    document.getElementById('sensorPage').style.display = 'none';
    showController();
});

/* =============================================
   SENSORS
============================================= */
function startSensors() {
    if (sensorsOn) return;
    sensorsOn = true;

    window.addEventListener('deviceorientation', (e) => {
        data.alpha = e.alpha || 0;
        data.beta = e.beta || 0;
        data.gamma = e.gamma || 0;
    });

    window.addEventListener('devicemotion', (e) => {
        let a = e.accelerationIncludingGravity;
        if (a) {
            data.ax = a.x || 0;
            data.ay = a.y || 0;
            data.az = a.z || 0;
        }
    });

    sendLoop = setInterval(() => {
        if (conn && conn.open) {
            conn.send({
                alpha: data.alpha,
                beta: data.beta,
                gamma: data.gamma,
                ax: data.ax,
                ay: data.ay,
                az: data.az,
                fire: data.fire,
                recalibrate: data.recalibrate
            });

            data.fire = false;
            data.recalibrate = false;

            document.getElementById('dPitch').textContent = 'pitch: ' + data.beta.toFixed(1);
            document.getElementById('dRoll').textContent = 'roll: ' + data.gamma.toFixed(1);
            document.getElementById('dYaw').textContent = 'yaw: ' + data.alpha.toFixed(1);
        }
    }, 1000 / 60);
}

/* =============================================
   CONTROLLER UI
============================================= */
function showController() {
    document.getElementById('joinPage').style.display = 'none';
    document.getElementById('sensorPage').style.display = 'none';
    document.getElementById('controlPage').style.display = 'flex';
}

// Fire
const fireButton = document.getElementById('fireButton');

fireButton.addEventListener('touchstart', (e) => {
    e.preventDefault();
    data.fire = true;
    fireButton.classList.add('flash');
    setTimeout(() => fireButton.classList.remove('flash'), 120);
    if (navigator.vibrate) navigator.vibrate(40);
});

fireButton.addEventListener('mousedown', (e) => {
    e.preventDefault();
    data.fire = true;
});

// Calibrate
document.getElementById('calButton').addEventListener('click', () => {
    data.recalibrate = true;
    if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
});

// Prevent scroll
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

// Screen awake
async function stayAwake() {
    try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    } catch (e) {}
}
stayAwake();
</script>
</body>
</html>
